name: Costco Online Monitor

on:
  schedule:
    # 日本時間 06:00(21:00 UTC), 12:00(03:00 UTC), 18:00(09:00 UTC), 21:00(12:00 UTC)
    - cron: '0 21,3,9,12 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの write 権限を許可（data.json の push に必須）

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存ライブラリとブラウザのインストール
        run: |
          npm install puppeteer axios
          npx puppeteer browsers install

      - name: スクレイピングとGAS連携の実行
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: |
          # JSTの現在時刻（時）を取得
          HOUR=$(TZ='Asia/Tokyo' date +'%H')
          
          # 06時以外（12時, 18時, 21時など）は在庫のみモードで実行
          if [ "$HOUR" -ne "06" ]; then
            echo "📦 在庫状況のみのチェックモードで実行します (実行時刻: ${HOUR}時)"
            CHECK_MODE=stock_only node scrape.js
          else
            echo "🔍 全項目のチェックモードで実行します (実行時刻: ${HOUR}時)"
            node scrape.js
          fi

      - name: 変更されたデータをGitHubにコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # package.json などの一時的な変更のみを破棄（data.json は保持）
          git checkout -- package*.json || true
          
          if [ -f data.json ]; then
            git add data.json
            git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Update product data" && git push)
          else
            echo "data.json が存在しないためコミットをスキップします。"
          fi
