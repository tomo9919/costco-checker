name: Costco Online Monitor

on:
  schedule:
    # 毎日 日本時間 07:00 (UTC 22:00) に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存ライブラリとブラウザのインストール
        run: |
          npm install puppeteer axios
          npx puppeteer browsers install

      - name: スクレイピングとGAS連携の実行
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
        run: node scrape.js

      - name: 変更されたデータをGitHubにコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Update product data" && git push)
